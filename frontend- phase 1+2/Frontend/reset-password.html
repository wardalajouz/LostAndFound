<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Findly</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="reset">
  <div id="app" v-cloak>
    <main id="auth-layout">
      <aside id="intro">
        <a href="home.html">Findly.</a>
        <div>
          <p>{{ t.university }}</p>
          <h1>{{ t.introResetTitle }}</h1>
          <p>{{ t.introResetDescription }}</p>
          <img id="intro-image" src="images/findly-lost-found.png" :alt="t.introResetAlt">
        </div>
        <p>{{ t.campusMembers }}</p>
      </aside>
      <section id="auth-panel">
        <button id="language-switch" type="button" @click="toggleLanguage" :aria-label="t.switchLanguage">{{ language === "en" ? "عربي" : "English" }}</button>
        <div id="auth-content">
        <h1>{{ t.resetTitle }}</h1>
        <p>{{ t.resetDescription }}</p>
        <form id="auth-form" @input="clearFeedback" @change="clearFeedback" @submit.prevent="checkResetPassword">
          <label for="email">{{ t.email }}</label>
          <input id="email" type="email" v-model.trim="email" autocomplete="email" required>
          <label for="token">{{ t.resetToken }}</label>
          <input id="token" v-model.trim="resetToken" autocomplete="off" required>
          <label for="newPassword">{{ t.newPassword }}</label>
          <input id="newPassword" :type="showPassword ? 'text' : 'password'" v-model="newPassword" minlength="8" maxlength="128" autocomplete="new-password" required>
          <label for="confirmNewPassword">{{ t.confirmNewPassword }}</label>
          <input id="confirmNewPassword" :type="showConfirmPassword ? 'text' : 'password'" v-model="confirmNewPassword" autocomplete="new-password" required>
          <div id="checks">
            <label><input type="checkbox" v-model="showPassword">{{ t.showPassword }}</label>
            <label><input type="checkbox" v-model="showConfirmPassword">{{ t.showConfirmation }}</label>
          </div>
          <button type="submit">{{ t.resetPassword }}</button>
        </form>
        <p id="error" v-if="error" role="alert">{{ t[error] }}</p>
        <p id="preview-status" v-if="message" role="status">{{ t[message] }}</p>
        <div id="auth-links"><a href="login.html">{{ t.backToLogin }}</a><a href="forgot.html">{{ t.requestNewLink }}</a></div>
        <p id="auth-note">{{ t.resetNote }}</p>
      </div></section>
    </main>
  </div>
  <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="js/language.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
